<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>문피아 투데이 베스트 200위 조회수 추이</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #12141c;
    --panel: #1b1e29;
    --ink: #e9e9ef;
    --muted: #8b8fa3;
    --accent: #6ee7c8;
    --line: #2a2e3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  h2 { font-size: 16px; font-weight: 700; margin: 0 0 16px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 760px) {
    .cols { grid-template-columns: 1fr; }
  }
  .current { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .current .num { font-size: 40px; font-weight: 800; color: var(--accent); }
  .current .title { font-size: 15px; color: var(--ink); }
  .current .meta { font-size: 13px; color: var(--muted); width: 100%; }
  canvas { max-height: 320px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); color: var(--ink); }
  th { color: var(--muted); font-weight: 500; }
  td.num-cell { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 40px 0; }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-header button {
    background: var(--line);
    border: none;
    color: var(--ink);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 14px;
  }
  .cal-header button:hover { background: #363b4d; }
  .cal-title { font-weight: 700; font-size: 15px; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .cal-dow {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding-bottom: 4px;
  }
  .cal-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 13px;
    cursor: default;
    color: var(--muted);
  }
  .cal-day.has-data {
    background: rgba(110,231,200,0.12);
    color: var(--ink);
    cursor: pointer;
  }
  .cal-day.has-data:hover { background: rgba(110,231,200,0.25); }
  .cal-day.selected {
    background: var(--accent);
    color: #12141c;
    font-weight: 700;
  }
  .cal-day.empty-cell { visibility: hidden; }
  .day-detail-title { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .cutline-title { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>문피아 투데이 베스트 · 200위 조회수 추이</h1>
    <div class="sub">1시간 간격으로 자동 수집된 기록입니다.</div>

    <div class="cols">
      <div>
        <div class="panel" id="currentPanel">
          <div class="empty">데이터를 불러오는 중...</div>
        </div>
        <div class="panel">
          <div class="day-detail-title" id="dayDetailTitle">오늘 — 0시부터 24시까지 시간대별 조회수</div>
          <canvas id="dayChart"></canvas>
        </div>
      </div>

      <div>
        <div class="panel">
          <div class="cal-header">
            <button id="prevMonth">‹ 이전</button>
            <div class="cal-title" id="calTitle"></div>
            <button id="nextMonth">다음 ›</button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </div>
        <div class="panel">
          <h2>페이지별 커트라인</h2>
          <div class="cutline-title" id="cutlineTitle"></div>
          <table id="cutlineTable"></table>
        </div>
      </div>
    </div>
  </div>
